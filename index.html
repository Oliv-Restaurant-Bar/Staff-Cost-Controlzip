<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport — viewport-fit=cover for iPhone notch/home-indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>OLIV – Staff Cost Control</title>
    <meta name="description" content="Dein persönlicher Dienstplan" />

    <!-- PWA / App-feel -->
    <meta name="theme-color" content="#1B1B19" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS / Safari home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dienstplan" />

    <!-- Splash / Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon (Oliv-Logo; ?v= umgeht den hartnäckigen Browser-Cache) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
